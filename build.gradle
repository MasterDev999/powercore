plugins {
    id 'java'
}

group 'me.powercore'
version '1.1.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.bukkit:bukkit:1.21.1' // Adjust the version as necessary
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'me.powercore.PowerCore',
            'Version': version
        )
    }
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'