name: PowerCore
version: 1.1.0
main: me.powercore.PowerCore
api-version: 1.21.1

commands:
  pvp:
    description: Toggles PvP on/off server-wide.
    usage: /pvp
  recipe:
    description: Shows recipe shape and ingredients in chat.
    usage: /recipe <key>
  revive:
    description: Revives a banned player.
    usage: /revive <player>
  withdraw:
    description: Converts 1 heart into a heart item.
    usage: /withdraw

permissions:
  powercore.pvp:
    description: Allows the player to toggle PvP.
    default: op
  powercore.recipe:
    description: Allows the player to view recipes.
    default: true
  powercore.revive:
    description: Allows the player to revive banned players.
    default: op
  powercore.withdraw:
    description: Allows the player to withdraw hearts.
    default: true